<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
    <title>Lab6 What2do-Contact Us</title>
</head>
<body>
    <nav class="navbar md:navbar-expand bg-1">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">What2Do</a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body mb-2 md:mb-0">
        <ul class="nav navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Link</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>
        </ul>
      </div>
    </dialog>
  </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">Contact Us</h1>
<form>
  <div class="row g-3 mb-3">
    <div class="col-12 md:col-6 form-field">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" class="form-control" id="firstName" required>
    </div>

    <div class="col-12 md:col-6 form-field">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lastName" required>
    </div>

    <div class="mb-3 form-field">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
        <div id="emailHelp" class="form-text">We’ll never share your email with anyone else.</div>
    </div>

    <div class="mb-3 form-field">
      <label for="topic" class="form-label">Subject</label>
      <select class="form-select" id="topic" required>
        <option value="" selected disabled>Choose a topic...</option>
        <option value="events">Club Events & Tickets</option>
        <option value="membership">Joining a Club</option>
        <option value="general">General Inquiry</option>
      </select>
    </div>

    <div class="mb-3 form-field">
      <label for="message" class="form-label">Message</label>
      <textarea class="form-control" id="message" rows="4" required></textarea>
    </div>

    <div class="mb-3 form-field">
      <input type="checkbox" id="consent" class="check" required>
      <label for="consent">I agree to be contacted regarding my inquiry.</label>
    </div>

  <button type="submit" class="btn-solid theme-primary">Submit</button>
</form>
</div>

<footer class="text-center">
    <p>&copy; What2Do</p>
</footer>

</body>
</html>
